[workspace]
resolver = "2"
members = [
    "crates/hdge-schema",
    "crates/hdge-core",
    "apps/hdge-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Manus AI <noreply@manus.local>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
eframe = { version = "0.26.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
